name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Тесты трогают реестр и DPAPI, поэтому идут на Windows
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet run --project tests/Wallshall.Tests/Wallshall.Tests.csproj -c Release

  # Собирается только по тегу vX.Y.Z и только после зелёных тестов.
  # Версия берётся из тега, поэтому в .exe попадает ровно то, что указано в релизе.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: >
          dotnet publish src/Wallshall/Wallshall.csproj -c Release -r win-x64
          -p:EnableWindowsTargeting=true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${GITHUB_REF_NAME#v}
          --self-contained true -o dist

      - run: ls -l dist

      # Запасной выход: если выкладка релиза отвалится, .exe можно забрать отсюда
      - uses: actions/upload-artifact@v4
        with:
          name: Wallshall
          path: dist/Wallshall.exe

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/Wallshall.exe
