name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: dotnet run --project tests/Wallshall.Tests/Wallshall.Tests.csproj -c Release

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: >
          dotnet publish src/Wallshall/Wallshall.csproj -c Release -r win-x64
          -p:EnableWindowsTargeting=true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${GITHUB_REF_NAME#v}
          --self-contained true -o dist

      - run: ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: Wallshall
          path: dist/Wallshall.exe

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/Wallshall.exe